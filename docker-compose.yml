services:
  backend:
    build:
      context: ./backend
    environment:
      PROCESSING_SECONDS: "30"
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
      - backend_instance:/app/instance

  frontend:
    build:
      context: ./frontend
    environment:
      TARO_APP_API_BASE_URL: http://127.0.0.1:5000/api
    depends_on:
      - backend
    ports:
      - "10086:10086"
    volumes:
      # 仅挂载需要热更新的源码与配置，避免覆盖镜像中由 npm ci 安装的依赖。
      - ./frontend/src:/app/src
      - ./frontend/config:/app/config
      - ./frontend/babel.config.js:/app/babel.config.js
      - ./frontend/project.config.json:/app/project.config.json
      - ./frontend/tsconfig.json:/app/tsconfig.json
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:10086/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s

volumes:
  backend_uploads:
  backend_instance:

